<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>طباعة QR Code</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; padding: 50px; background-color: #f4f4f9; }
        .qr-container { background: white; padding: 20px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        img { width: 250px; height: 250px; }
        .print-btn { margin-top: 20px; padding: 12px 25px; font-size: 18px; cursor: pointer; background: #00ffcc; border: none; border-radius: 8px; font-weight: bold; }
        @media print { 
            .print-btn { display: none; } 
            body { background-color: white; }
            .qr-container { box-shadow: none; border: 2px solid #000; }
        }
    </style>
</head>
<body>
    <div class="qr-container">
        <h2>Smart Tag - QR Code</h2>
        <img src="{{ url_for('static', filename='qrcodes/' + user_id + '.png') }}" alt="QR Code">
        <p>User ID: <strong>{{ user_id }}</strong></p>
        <button class="print-btn" onclick="window.print()">طباعة الآن 🖨️</button>
    </div>
</body>
</html>
