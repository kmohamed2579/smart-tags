<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>تسجيل بيانات الـ QR Code</title>
</head>
<body>
    <div class="form-container">
        <h2>أهلاً بيك! احمي ممتلكاتك دلوقتي</h2>
        
        <!-- البيانات هتروح للرابط ده في البايثون -->
        <form action="/generate_qr" method="POST">
            
            <label>الاسم (أو اسم مستعار):</label>
            <input type="text" name="name" placeholder="مثال: كينزي محمد" required>
            
            <label>رقم التليفون الأساسي:</label>
            <input type="tel" name="phone" placeholder="01xxxxxxxxx" required>
            
            <label>رقم الواتساب (لاستلام التنبيهات):</label>
            <input type="tel" name="whatsapp" placeholder="01xxxxxxxxx" required>

            <!-- اختيارات الخصوصية اللي تناقشنا فيها -->
            <div class="options">
                <label>
                    <input type="checkbox" name="hide_number">
                    إخفاء رقمي (المكتشف مش هيشوف رقمك، وهيبعتلك رسالة هتوصلك من سيستم الموقع على واتساب)
                </label>
                <br><br>
                <label>
                    <input type="checkbox" name="enable_location" checked>
                    تفعيل "تنبيه بالمكان" (لو حد عمل سكان للـ QR، هيبعتلك لوكيشن على الواتساب)
                </label>
            </div>

            <button type="submit">إنشاء الـ QR الخاص بيا</button>
        </form>
    </div>
</body>
</html>
